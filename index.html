<html>

<head>
    <title>Apollo-BCA</title>
    <link rel="stylesheet" href="Assets/CSS/style.css">
</head>

<body>
    <div class="login container">
        <section class="left-side">
            <div class="left-content">
                <div class="logo">
                    <img src="Assets/Images/logo apollo.png" alt="Logo">
                </div>
                <div class="title">
                    <h1>BCA</h1>
                </div>
                <p class="tagline">
                    Learn. <span>Track.</span> Grow.
                </p>
            </div>
        </section>
        <!-- RIGHT SIDE -->
        <section class="right-side">

            <div class="login-card">

                <div class="login-heading">
                    <h1>Welcome Back!</h1>
                    <p>Login to continue to your account</p>
                    <div class="heading-line"></div>
                </div>

                <form class="login-form">

                    <!-- Username -->
                    <div class="input-group">
                        <label for="username">Email / Username</label>

                        <div class="input-wrapper">
                            <input type="text" id="username" name="username" placeholder="Email / Username">
                        </div>
                    </div>


                    <!-- Password -->
                    <div class="input-group">
                        <label for="password">Password</label>

                        <div class="input-wrapper">
                            <input type="password" id="password" name="password" placeholder="Password">

                            <button type="button" class="password-toggle" aria-label="Show password">
                                👁
                            </button>
                        </div>
                    </div>


                    <!-- Login Role -->
                    <div class="role-section">

                        <h3>Login as</h3>

                        <div class="role-container">

                            <button type="button" class="role-card active">
                                <span class="role-icon">🎓</span>
                                <span>Student</span>
                            </button>

                            <button type="button" class="role-card active">
                                <span class="role-icon">👥</span>
                                <span>Parent</span>
                            </button>

                            <button type="button" class="role-card active">
                                <span class="role-icon">👨‍🏫</span>
                                <span>Professor</span>
                            </button>

                        </div>

                    </div>

                    <!-- Course Selection -->
                    <div class="input-group">
                        <label for="course">Course</label>

                        <div class="input-wrapper">
                            <select id="course" name="course">
                                <option value="">Select Course</option>
                                <option value="BCA">BCA</option>
                                <option value="MCA">MCA</option>
                                <option value="BBA">BBA</option>
                            </select>
                        </div>
                    </div>


                    <!-- Remember / Forgot -->
                    <div class="login-options">

                        <label class="remember">
                            <input type="checkbox">
                            <span>Remember me</span>
                        </label>

                        <a href="#" class="forgot-password">
                            Forgot Password?
                        </a>

                    </div>


                    <!-- Login Button -->
                    <button type="submit" class="login-btn" onclick="window.location.href='dashboard.html'">
                        <span>→</span>
                        LOGIN
                    </button>


                    <!-- Contact -->
                    <p class="contact-text">
                        New here?
                        <a href="#">Contact your institute</a>
                    </p>

                </form>

            </div>

        </section>
    </div>
    <script src="Assets/JS/login.js"></script>
</body>
</body>

</html>
