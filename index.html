<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apollo-BCA</title>
    <link rel="stylesheet" href="Assets/CSS/style.css">
</head>

<body>
    <div class="login container">

        <section class="left-side">
            <div class="left-content">
                <div class="logo">
                    <img src="Assets/Images/logo apollo.png" alt="Logo">
                </div>
                <div class="title">
                    <h1>BCA</h1>
                </div>
                <p class="tagline">Learn. <span>Track.</span> Grow.</p>
            </div>
        </section>

        <section class="right-side">
            <div class="login-card">

                <div class="login-heading">
                    <h1>Welcome Back!</h1>
                    <p>Login to continue to your account</p>
                    <div class="heading-line"></div>
                </div>

                <form class="login-form" id="loginForm">

                    <div class="input-group">
                        <label for="username">Email</label>
                        <div class="input-wrapper">
                            <input type="email" id="username" name="email" placeholder="Enter your email" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <input type="password" id="password" name="password" placeholder="Password" required>
                            <button type="button" class="password-toggle" id="passwordToggle"
                                aria-label="Show password">👁</button>
                        </div>
                    </div>

                    <div class="role-section">
                        <h3>Login as</h3>
                        <div class="role-container">
                            <button type="button" class="role-card active" data-role="student">
                                <span class="role-icon">🎓</span><span>Student</span>
                            </button>
                            <button type="button" class="role-card" data-role="parent">
                                <span class="role-icon">👥</span><span>Parent</span>
                            </button>
                            <button type="button" class="role-card" data-role="faculty">
                                <span class="role-icon">👨‍🏫</span><span>Professor</span>
                            </button>
                        </div>
                        <input type="hidden" id="role" name="role" value="student">
                    </div>

                    <div class="input-group">
                        <label for="course">Course</label>
                        <div class="input-wrapper">
                            <select id="course" name="course" required>
                                <option value="">Select Course</option>
                                <option value="BCA">BCA</option>
                                <option value="MCA">MCA</option>
                                <option value="BBA">BBA</option>
                            </select>
                        </div>
                    </div>

                    <!-- OTP field appears only after Send OTP is clicked -->
                    <div class="input-group" id="otpGroup" hidden>
                        <label for="otp">Email OTP</label>
                        <div class="input-wrapper">
                            <input type="text" id="otp" name="otp" placeholder="Enter 6-digit OTP" inputmode="numeric"
                                maxlength="6" pattern="[0-9]{6}">
                        </div>
                    </div>

                    <div class="login-options">
                        <label class="remember">
                            <input type="checkbox" id="rememberMe">
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="forgot-password">Forgot Password?</a>
                    </div>

                    <button type="submit" class="login-btn" id="mainBtn">
                        <span>→</span> SEND OTP
                    </button>

                    <p id="loginStatus" role="status" aria-live="polite"></p>

                    <p class="contact-text">
                        New here? <a href="#">Contact your institute</a>
                    </p>

                </form>
            </div>
        </section>
    </div>

    <script src="Assets/JS/login.js"></script>
</body>

</html>
