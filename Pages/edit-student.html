<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Student</title>

    <link rel="stylesheet" href="../Assets/CSS/add-student.css">

</head>

<body>

    <div class="page">

        <header class="page-header">

            <div>
                <h1>Edit Student</h1>
                <p>Update student information</p>
            </div>

            <a href="students.html" class="back-btn">

                ← Students

            </a>

        </header>


        <section class="form-card">

            <form id="editStudentForm">

                <div class="form-group">

                    <label for="name">
                        Student Name
                    </label>

                    <input type="text" id="name" required>

                </div>


                <div class="form-group">

                    <label for="roll_no">
                        Roll Number
                    </label>

                    <input type="text" id="roll_no" required>

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input type="email" id="email" required>

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label for="course">
                            Course
                        </label>

                        <select id="course" required>

                            <option value="">
                                Select Course
                            </option>

                            <option value="BCA">
                                BCA
                            </option>

                            <option value="BBA">
                                BBA
                            </option>

                            <option value="MCA">
                                MCA
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="semester">
                            Semester
                        </label>

                        <select id="semester" required>

                            <option value="">
                                Select Semester
                            </option>

                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>

                        </select>

                    </div>

                </div>


                <button type="submit" id="updateStudentBtn">

                    Update Student

                </button>

            </form>

        </section>

    </div>


    <script src="../Assets/JS/edit-student.js"></script>

</body>

</html>
