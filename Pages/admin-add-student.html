<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student | Apollo Admin</title>

    <link rel="stylesheet" href="../Assets/CSS/admin-add-student.css">
</head>

<body>

    <div class="admin-layout">

        <aside class="admin-sidebar">
            <div class="admin-brand">
                <div class="admin-brand-logo">A</div>
                <div>
                    <h2>Apollo</h2>
                    <small>Admin Panel</small>
                </div>
            </div>

            <nav class="admin-nav">
                <a href="admin-dashboard.html">Dashboard</a>
                <a href="admin-students.html" class="active">Student Management</a>
                <a href="#" id="facultyLink">Faculty Management</a>
                <a href="admin-support.html">Support Requests</a>
                <a href="manage-notices.html">Manage Notices</a>
            </nav>

            <button class="admin-logout" id="logoutButton">Logout</button>
        </aside>

        <main class="admin-main">

            <header class="admin-topbar">
                <div>
                    <h1>Add New Student</h1>
                    <p>Register a student in the Apollo Attendance System.</p>
                </div>

                <div class="admin-user">
                    <div class="admin-avatar">A</div>
                    <div>
                        <strong id="adminName">Loading...</strong>
                        <p id="adminEmail"></p>
                    </div>
                </div>
            </header>

            <section class="student-table-section add-student-section">
                <form id="addStudentForm">

                    <div class="form-group">
                        <label for="studentName">Full Name</label>
                        <input type="text" id="studentName" name="name" placeholder="Enter student's full name"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="studentEmail">Email Address</label>
                        <input type="email" id="studentEmail" name="email" placeholder="Enter student's email" required>
                    </div>

                    <div class="form-group">
                        <label for="rollNumber">Roll Number</label>
                        <input type="text" id="rollNumber" name="roll_no" placeholder="Enter roll number" required>
                    </div>

                    <div class="form-group">
                        <label for="studentCourse">Course</label>
                        <select id="studentCourse" name="course" required>
                            <option value="">Select course</option>
                            <option value="BCA">BCA</option>
                            <option value="MCA">MCA</option>
                            <option value="BBA">BBA</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="studentSemester">Semester</label>
                        <select id="studentSemester" name="semester" required>
                            <option value="">Select semester</option>
                            <option value="1">Semester 1</option>
                            <option value="2">Semester 2</option>
                            <option value="3">Semester 3</option>
                            <option value="4">Semester 4</option>
                            <option value="5">Semester 5</option>
                            <option value="6">Semester 6</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="studentPassword">Initial Password</label>
                        <input type="password" id="studentPassword" name="password" placeholder="At least 8 characters"
                            minlength="8" autocomplete="new-password" required>
                    </div>

                    <p id="formMessage" role="status"></p>

                    <div class="form-actions">
                        <button type="submit" class="admin-button" id="saveStudentButton">
                            Add Student
                        </button>

                        <a href="admin-students.html" class="back-link">
                            Cancel
                        </a>
                    </div>

                </form>
            </section>

        </main>
    </div>

    <script src="../Assets/JS/admin-add-student.js"></script>

</body>

</html>
