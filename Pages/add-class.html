<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Today's Class</title>

    <link rel="stylesheet" href="../Assets/CSS/add-class.css">

</head>

<body>

    <div class="page-container">

        <div class="page-header">

            <div>

                <h1>Add Today's Class</h1>

                <p>
                    Add a class for today's schedule
                </p>

            </div>

            <a href="faculty-dashboard.html" class="back-btn">
                ← Back
            </a>

        </div>


        <div class="form-card">

            <form id="addClassForm">


                <!-- Time -->

                <div class="form-row">

                    <div class="form-group">

                        <label for="startTime">
                            Start Time
                        </label>

                        <input type="time" id="startTime" required>

                    </div>


                    <div class="form-group">

                        <label for="endTime">
                            End Time
                        </label>

                        <input type="time" id="endTime" required>

                    </div>

                </div>


                <!-- Subject -->

                <div class="form-group">

                    <label for="subject">
                        Subject
                    </label>

                    <select id="subject" required>

                        <option value="">
                            Loading subjects...
                        </option>

                    </select>

                </div>


                <!-- Room -->

                <div class="form-group">

                    <label for="room">
                        Room
                    </label>

                    <input type="text" id="room" placeholder="Enter room number" required>

                </div>


                <button type="submit" id="saveClassBtn">

                    Add Today's Class

                </button>

            </form>

        </div>

    </div>


    <script src="../Assets/JS/add-class.js"></script>

</body>

</html>
