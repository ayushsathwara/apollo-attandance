<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notices | Apollo</title>

    <link rel="stylesheet" href="../Assets/CSS/notices.css">
</head>

<body>

    <!-- HEADER -->
    <header class="top-header">

        <div>
            <h2>Notices</h2>
            <p>Stay updated with the latest college announcements</p>
        </div>

        <div class="header-right">

            <div class="notification">
                🔔
                <span class="notification-dot"></span>
            </div>

            <div class="user-mini">
                <div class="mini-avatar" id="miniAvatar">
                    S
                </div>

                <strong id="miniName">Student</strong>
            </div>

        </div>

    </header>


    <main class="notices-container">

        <!-- PAGE INTRO -->
        <section class="notice-intro">

            <div>
                <span class="intro-label">COLLEGE UPDATES</span>

                <h1>Latest Notices</h1>

                <p>
                    Important announcements, academic updates and
                    upcoming activities from Apollo Institute.
                </p>
            </div>

            <div class="notice-big-icon">
                📢
            </div>

        </section>


        <!-- FILTERS -->
        <div class="notice-toolbar">

            <div class="filter-buttons">

                <button class="filter-btn active" data-filter="all">
                    All
                </button>

                <button class="filter-btn" data-filter="academic">
                    Academic
                </button>

                <button class="filter-btn" data-filter="exam">
                    Exams
                </button>

                <button class="filter-btn" data-filter="event">
                    Events
                </button>

            </div>

            <div class="notice-count">
                <span id="noticeCount">6</span> Notices
            </div>

        </div>


        <!-- NOTICE LIST -->
        <section class="notice-list" id="noticeList">
            <p class="notice-loading">Loading notices...</p>
        </section>



        <!-- EMPTY MESSAGE -->
        <div class="empty-notices" id="emptyNotices">

            <div>📭</div>

            <h3>No notices found</h3>

            <p>
                There are no notices in this category.
            </p>

        </div>

    </main>


    <script src="../Assets/JS/notices.js"></script>

</body>

</html>
