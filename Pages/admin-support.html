<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Requests | Apollo Admin</title>

    <link rel="stylesheet" href="../Assets/CSS/admin-support.css">
</head>

<body>

    <main class="support-page">
        <header class="page-header">
            <div>
                <p class="eyebrow">APOLLO ADMINISTRATION</p>
                <h1>Support Requests</h1>
                <p class="subtitle">
                    Review and manage problems reported by students.
                </p>
            </div>

            <a href="admin-dashboard.html" class="back-link">
                ← Dashboard
            </a>
        </header>

        <section class="summary-grid">
            <article class="summary-card">
                <span>Total Requests</span>
                <strong id="totalCount">0</strong>
            </article>

            <article class="summary-card">
                <span>Open</span>
                <strong id="openCount">0</strong>
            </article>

            <article class="summary-card">
                <span>In Progress</span>
                <strong id="progressCount">0</strong>
            </article>

            <article class="summary-card">
                <span>Resolved</span>
                <strong id="resolvedCount">0</strong>
            </article>
        </section>

        <section class="requests-panel">
            <div class="panel-header">
                <div>
                    <h2>Student Problems</h2>
                    <p>View each request and update its status.</p>
                </div>

                <button type="button" id="refreshButton">
                    Refresh
                </button>
            </div>

            <p id="pageMessage" role="status">Loading requests...</p>

            <div id="requestsList" class="requests-list"></div>
        </section>
    </main>

    <script src="../Assets/JS/admin-support.js"></script>
</body>

</html>
